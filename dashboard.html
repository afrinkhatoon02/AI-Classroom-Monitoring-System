<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Dashboard</title>

<style>

body, html {

    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;

    background: url('bg/dashboard bg.png') no-repeat center center fixed;
    background-size: cover;

}

/* ===================================== */
/* TOP BAR */
/* ===================================== */

.top-bar {

    margin: 30px 40px 0 40px;

    padding: 20px;

    background-color: rgba(0,0,0,0.5);

    border-radius: 10px;

    display: flex;
    flex-direction: column;

    gap: 15px;

    align-items: center;

}

.top-bar h1 {

    color: white;
    margin: 0;

    font-size: 24px;

}

/* ===================================== */
/* COURSE ROW */
/* ===================================== */

.course-row {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

}

.course-container {

    display: flex;

    gap: 15px;

    overflow-x: auto;

    scroll-behavior: smooth;

    padding: 5px 0;

}

.course-container::-webkit-scrollbar {

    display: none;

}

/* ===================================== */
/* COURSE CARD */
/* ===================================== */

.course-card {

    background-color: rgba(255,255,255,0.1);

    color: white;

    padding: 12px 18px;

    border-radius: 8px;

    min-width: 120px;

    text-align: center;

    white-space: nowrap;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    gap: 5px;

    transition: transform 0.2s,
                background-color 0.2s;

}

.course-card:hover {

    transform: scale(1.08);

}

.course-card.selected {

    background-color: rgba(0,150,255,0.6);

}

.section {

    font-weight: bold;

    font-size: 18px;

}

.course {

    font-size: 14px;

    color: #ddd;

}

/* ===================================== */
/* SCROLL BUTTONS */
/* ===================================== */

.scroll-btn {

    background-color: rgba(255,255,255,0.2);

    border: none;

    color: white;

    padding: 10px 15px;

    cursor: pointer;

    border-radius: 5px;

    transition: background-color 0.2s;

}

.scroll-btn:hover {

    background-color: rgba(255,255,255,0.4);

}

/* ===================================== */
/* ACTION BUTTONS */
/* ===================================== */

.action-buttons {

    display: none;

    gap: 10px;

    margin-top: 10px;

}

.action-buttons button {

    padding: 8px 15px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    color: white;

    transition: background-color 0.2s;

}

.monitor-btn {

    background-color: #007bff;

}

.report-btn {

    background-color: #28a745;

}

.monitor-btn:hover {

    background-color: #0056b3;

}

.report-btn:hover {

    background-color: #1e7e34;

}

/* ===================================== */
/* CONTROL PANEL */
/* ===================================== */

.control-panel {

    display: none;

    margin: 20px 40px 0 40px;

    padding: 15px;

    background-color: rgba(0,0,0,0.5);

    border-radius: 10px;

    width: 220px;

    flex-direction: column;

    gap: 10px;

}

.control-panel button {

    padding: 10px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    color: white;

    font-weight: bold;

}

.start-btn {

    background-color: green;

}

.stop-btn {

    background-color: red;

}

.secondary-btn {

    background-color: blue;

}

.control-panel button:hover {

    opacity: 0.8;

}

</style>

</head>

<body>

<!-- ===================================== -->
<!-- TOP BAR -->
<!-- ===================================== -->

<div class="top-bar">

    <h1>Courses Allotted</h1>

    <div class="course-row">

        <button class="scroll-btn" onclick="scrollLeft()">

            &#8592;

        </button>

        <!-- DYNAMIC COURSES -->
        <div class="course-container" id="courseContainer">

        </div>

        <button class="scroll-btn" onclick="scrollRight()">

            &#8594;

        </button>

    </div>

    <!-- ACTION BUTTONS -->

    <div class="action-buttons" id="actionButtons">

        <button class="monitor-btn" onclick="showStart()">

            Monitor

        </button>

        <button class="report-btn" onclick="goToReport()">

            Report

        </button>

    </div>

</div>

<!-- ===================================== -->
<!-- CONTROL PANEL -->
<!-- ===================================== -->

<div class="control-panel" id="controlPanel">

    <button
        class="start-btn"
        id="startBtn"
        style="display:none;"
        onclick="startMonitoring()"
    >
        START
    </button>

    <button
    class="secondary-btn"
    id="attendanceBtn"
    style="display:none;"
    onclick="startAttendance()"
>
    ATTENDANCE
</button>

    <button
        class="secondary-btn"
        id="napBtn"
        style="display:none;"
    >
        NAP TRAP
    </button>

    <button
        class="secondary-btn"
        id="phoneBtn"
        style="display:none;"
    >
        PHONE DETECTION
    </button>

    <button
        class="secondary-btn"
        id="talkingBtn"
        style="display:none;"
    >
        TALKING
    </button>

    <button
        class="secondary-btn"
        id="attentionBtn"
        style="display:none;"
    >
        ATTENTIVENESS
    </button>

    <button
        class="stop-btn"
        id="endBtn"
        style="display:none;"
        onclick="endMonitoring()"
    >
        END
    </button>

</div>

<!-- ===================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================== -->

<script>

const container =
    document.getElementById('courseContainer');

const actionButtons =
    document.getElementById('actionButtons');

const controlPanel =
    document.getElementById('controlPanel');

const startBtn =
    document.getElementById('startBtn');

let selectedCourse = null;

// =====================================
// MODULE STATES
// =====================================

let attendanceRunning = false;

let phoneDetectionRunning = false;

// =====================================
// LOAD COURSES FROM DATABASE
// =====================================

window.onload = async function () {

    const faculty_id =
        sessionStorage.getItem("faculty_id");

    if (!faculty_id) {

        alert("Please Login First");

        window.location.href = "login.html";

        return;
    }

    try {

        let response = await fetch(

            `http://127.0.0.1:5000/get_faculty_courses?faculty_id=${faculty_id}`

        );

        let data = await response.json();

        if (response.ok) {

            const courseContainer =
                document.getElementById("courseContainer");

            courseContainer.innerHTML = "";

            data.courses.forEach(course => {

                let card =
                    document.createElement("div");

                card.className = "course-card";

                card.innerHTML = `

                    <div class="section">
                        Section ${course.section}
                    </div>

                    <div class="course">
                        ${course.course_id}
                    </div>

                `;

                card.dataset.courseid =
                    course.course_id;

                card.dataset.section =
                    course.section;

                card.dataset.dept =
                    course.dept;

                card.dataset.semester =
                    course.semester;

                card.onclick = function () {

                    selectCourse(card);

                };

                courseContainer.appendChild(card);

            });

        }

        else {

            alert(data.error);

        }

    }

    catch(error) {

        console.error(error);

        alert("Failed to load courses");

    }

};

// =====================================
// SCROLL
// =====================================

function scrollLeft() {

    container.scrollBy({
        left: -150,
        behavior: 'smooth'
    });

}

function scrollRight() {

    container.scrollBy({
        left: 150,
        behavior: 'smooth'
    });

}

// =====================================
// SELECT COURSE
// =====================================

function selectCourse(card) {

    if (selectedCourse) {

        selectedCourse.classList.remove('selected');

    }

    card.classList.add('selected');

    selectedCourse = card;

    actionButtons.style.display = 'flex';

    hideControlPanel();

}

// =====================================
// REPORT PAGE
// =====================================

function goToReport() {

    if (!selectedCourse) {

        alert("Please Select Course");

        return;
    }

    sessionStorage.setItem(
        "selected_course_id",
        selectedCourse.dataset.courseid
    );

    sessionStorage.setItem(
        "selected_section",
        selectedCourse.dataset.section
    );

    sessionStorage.setItem(
        "selected_dept",
        selectedCourse.dataset.dept
    );

    sessionStorage.setItem(
        "selected_semester",
        selectedCourse.dataset.semester
    );

    window.location.href = "report.html";

}

// =====================================
// SHOW START PANEL
// =====================================

function showStart() {

    controlPanel.style.display = 'flex';

    startBtn.style.display = 'block';

    hideMonitoringButtons();

}

// =====================================
// START MONITORING
// =====================================

function startMonitoring() {

    document.getElementById(
        'attendanceBtn'
    ).style.display = 'block';

    document.getElementById(
        'napBtn'
    ).style.display = 'block';

    document.getElementById(
        'phoneBtn'
    ).style.display = 'block';

    document.getElementById(
        'talkingBtn'
    ).style.display = 'block';

    document.getElementById(
        'attentionBtn'
    ).style.display = 'block';

    document.getElementById(
        'endBtn'
    ).style.display = 'block';

}

// =====================================
// START ATTENDANCE CAMERA
// =====================================

async function startAttendance() {

    if (!selectedCourse) {

        alert("Please Select Course");

        return;
    }

    const btn =
        document.getElementById("attendanceBtn");

    attendanceRunning = true;

    btn.style.backgroundColor =
        "lightgreen";

    const faculty_id =
        sessionStorage.getItem("faculty_id");

    const course_id =
        selectedCourse.dataset.courseid;

    const section =
        selectedCourse.dataset.section;

    try {

        const response = await fetch(
            "http://127.0.0.1:5001/start_attendance",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    faculty_id: faculty_id,

                    course_id: course_id,

                    section: section

                })

            }
        );

        const data = await response.json();

        if (response.ok) {

            alert("Attendance Session Started");

            console.log(data);

        }

        else {

            alert(data.error);

        }

    }

    catch(error) {

        console.error(error);

        alert("Failed To Start Attendance");

    }

}

// =====================================
// PHONE DETECTION
// =====================================

document.getElementById(
    "phoneBtn"
).addEventListener("click", togglePhoneDetection);

async function togglePhoneDetection() {

    if (!selectedCourse) {

        alert("Please Select Course");

        return;
    }

    const btn =
        document.getElementById("phoneBtn");

    const faculty_id =
        sessionStorage.getItem("faculty_id");

    const course_id =
        selectedCourse.dataset.courseid;

    const section =
        selectedCourse.dataset.section;

    // =====================================
    // TURN ON
    // =====================================

    if (!phoneDetectionRunning) {

        phoneDetectionRunning = true;

        btn.style.backgroundColor =
            "lightgreen";

        try {

            const response = await fetch(
                "http://127.0.0.1:5001/start_phone_detection",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        faculty_id: faculty_id,

                        course_id: course_id,

                        section: section

                    })

                }
            );

            const data = await response.json();

            if (response.ok) {

                alert("Phone Detection Started");

            }

            else {

                alert(data.error);

            }

        }

        catch(error) {

            console.error(error);

            alert("Failed To Start Phone Detection");

        }

    }

    // =====================================
    // TURN OFF
    // =====================================

    else {

        phoneDetectionRunning = false;

        btn.style.backgroundColor =
            "lightcoral";

        try {

            await fetch(
                "http://127.0.0.1:5001/stop_phone_detection",
                {
                    method: "POST"
                }
            );

            alert("Phone Detection Stopped");

        }

        catch(error) {

            console.error(error);

        }

    }

}

// =====================================
// END MONITORING
// =====================================

async function endMonitoring() {

    hideMonitoringButtons();

    // =====================================
    // RESET BUTTON COLORS
    // =====================================

    document.getElementById(
        "attendanceBtn"
    ).style.backgroundColor = "blue";

    document.getElementById(
        "napBtn"
    ).style.backgroundColor = "blue";

    document.getElementById(
        "phoneBtn"
    ).style.backgroundColor = "blue";

    document.getElementById(
        "talkingBtn"
    ).style.backgroundColor = "blue";

    document.getElementById(
        "attentionBtn"
    ).style.backgroundColor = "blue";

    attendanceRunning = false;

    phoneDetectionRunning = false;

    // =====================================
    // STOP PHONE DETECTION
    // =====================================

    try {

        await fetch(
            "http://127.0.0.1:5002/stop_phone_detection",
            {
                method: "POST"
            }
        );

    }

    catch(error) {

        console.error(error);

    }

}

// =====================================
// HIDE BUTTONS
// =====================================

function hideMonitoringButtons() {

    document.getElementById(
        'attendanceBtn'
    ).style.display = 'none';

    document.getElementById(
        'napBtn'
    ).style.display = 'none';

    document.getElementById(
        'phoneBtn'
    ).style.display = 'none';

    document.getElementById(
        'talkingBtn'
    ).style.display = 'none';

    document.getElementById(
        'attentionBtn'
    ).style.display = 'none';

    document.getElementById(
        'endBtn'
    ).style.display = 'none';

}

// =====================================
// HIDE CONTROL PANEL
// =====================================

function hideControlPanel() {

    controlPanel.style.display = 'none';

}

</script>

</body>

</html>
